<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5f6f52">
  <meta name="description" content="保護猫データベース PWA">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>保護猫DB</title>
</head>
<body>
  <noscript>このアプリを利用するにはJavaScriptを有効にしてください。</noscript>

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">🐾</div>
      <div>
        <h1>保護猫DB</h1>
        <p id="connection-status">接続確認中…</p>
      </div>
    </div>
    <button id="install-button" class="secondary hidden" type="button">ホーム画面に追加</button>
  </header>

  <main>
    <section id="login-view" class="view hidden">
      <div class="panel narrow">
        <h2>ログイン</h2>
        <p class="muted">Supabase Authで登録したメールアドレスでログインしてください。</p>
        <form id="login-form">
          <label>メールアドレス<input id="login-email" type="email" required autocomplete="email"></label>
          <label>パスワード<input id="login-password" type="password" required autocomplete="current-password"></label>
          <button class="primary" type="submit">ログイン</button>
          <p id="login-message" class="message" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <section id="setup-view" class="view hidden">
      <div class="panel narrow">
        <h2>初期設定</h2>
        <p class="muted">まずSupabaseのURLとAnon Keyを設定してください。Anon KeyはRLSで保護された公開キーです。Service Role Keyは絶対に入力しないでください。</p>
        <form id="config-form">
          <label>Supabase Project URL<input id="config-url" type="url" placeholder="https://xxxxx.supabase.co" required></label>
          <label>Supabase Anon Key<textarea id="config-key" rows="4" required></textarea></label>
          <button class="primary" type="submit">保存して接続</button>
          <p id="config-message" class="message" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <section id="app-view" class="view hidden">
      <div class="toolbar">
        <div>
          <h2 id="page-title">猫一覧</h2>
          <p id="user-label" class="muted"></p>
        </div>
        <div class="toolbar-actions">
          <button id="new-cat-button" class="primary" type="button">＋ 猫を登録</button>
          <button id="refresh-button" class="secondary" type="button">更新</button>
          <button id="logout-button" class="secondary" type="button">ログアウト</button>
        </div>
      </div>

      <div id="list-panel" class="panel">
        <div class="filters">
          <label class="search-label">🔎 検索<input id="search-input" type="search" placeholder="名前・管理番号・保護場所"></label>
          <label>状態
            <select id="status-filter">
              <option value="">すべて</option>
              <option value="protected">保護中</option>
              <option value="adopted">譲渡済</option>
              <option value="deceased">死亡</option>
              <option value="missing">行方不明</option>
              <option value="other">その他</option>
            </select>
          </label>
        </div>
        <div id="cat-list" class="cat-list" aria-live="polite"></div>
      </div>

      <div id="detail-panel" class="panel hidden">
        <div class="detail-head">
          <button id="back-button" class="secondary" type="button">← 一覧</button>
          <div class="detail-actions">
            <button id="edit-cat-button" class="secondary" type="button">編集</button>
            <button id="print-button" class="primary" type="button">保健所PDF / 印刷</button>
          </div>
        </div>
        <div id="cat-detail"></div>
        <div id="drive-controls" class="drive-box hidden">
          <div class="toolbar">
            <div>
              <strong>Google Drive 写真</strong>
              <p class="muted">この猫の写真をDriveへ保存します。</p>
            </div>
            <div class="toolbar-actions">
              <button id="google-connect-button" class="secondary" type="button">Google Drive接続</button>
              <label class="primary" style="display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;cursor:pointer">
                📷 写真を追加
                <input id="photo-input" type="file" accept="image/*" multiple hidden>
              </label>
            </div>
          </div>
          <div id="drive-message" class="message" aria-live="polite"></div>
          <div id="drive-files" class="file-grid"></div>
        </div>
      </div>

      <div id="cat-form-panel" class="panel hidden">
        <div class="detail-head">
          <button id="cancel-cat-button" class="secondary" type="button">← 戻る</button>
          <h2 id="cat-form-title">猫を登録</h2>
        </div>
        <form id="cat-form" class="form-grid">
          <input id="cat-id" type="hidden">
          <label>管理番号<input id="management-no" placeholder="空欄なら自動採番"></label>
          <label>名前<input id="cat-name" required></label>
          <label>性別<select id="cat-sex"><option value="unknown">不明</option><option value="male">オス</option><option value="female">メス</option></select></label>
          <label>品種等<input id="cat-breed" value="雑種"></label>
          <label>保護日<input id="rescued-date" type="date"></label>
          <label>推定生年月日<input id="estimated-birth-date" type="date"></label>
          <label>推定年齢<input id="estimated-age" placeholder="例：推定2歳"></label>
          <label>状態<select id="cat-status"><option value="protected">保護中</option><option value="adopted">譲渡済</option><option value="deceased">死亡</option><option value="missing">行方不明</option><option value="other">その他</option></select></label>
          <label>不妊・去勢<select id="neuter-status"><option value="unknown">不明</option><option value="intact">未手術</option><option value="neutered">去勢済</option><option value="spayed">避妊済</option></select></label>
          <label class="full">現在のメモ<textarea id="current-note" rows="3"></textarea></label>
          <div class="form-actions full">
            <button class="primary" type="submit">保存</button>
            <button id="cancel-cat-button-2" class="secondary" type="button">キャンセル</button>
          </div>
          <p id="cat-form-message" class="message full" aria-live="polite"></p>
        </form>
      </div>

      <div id="observation-panel" class="panel hidden">
        <div class="detail-head">
          <button id="back-to-detail-button" class="secondary" type="button">← 猫詳細</button>
          <h2>観察日記を追加</h2>
        </div>
        <form id="observation-form" class="form-grid">
          <label>観察日<input id="obs-date" type="date" required></label>
          <label>体調<input id="obs-condition"></label>
          <label>食欲<input id="obs-appetite"></label>
          <label>排便<input id="obs-stool"></label>
          <label>排尿<input id="obs-urine"></label>
          <label>様子・行動<input id="obs-behavior"></label>
          <label>体重(kg)<input id="obs-weight" type="number" min="0.01" step="0.01"></label>
          <label>体温(℃)<input id="obs-temperature" type="number" min="30" max="45" step="0.1"></label>
          <label class="full">記録<textarea id="obs-memo" rows="6"></textarea></label>
          <div class="form-actions full">
            <button class="primary" type="submit">観察日記を保存</button>
            <button id="cancel-observation-button" class="secondary" type="button">キャンセル</button>
          </div>
          <p id="observation-message" class="message full" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
